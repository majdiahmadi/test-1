
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vigilance-agent"
version = "0.1.0"
description = "VIGIL SOC AI Agent Framework"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0.0",
    "jsonschema>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vigil*"]
